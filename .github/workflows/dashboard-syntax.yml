name: GastWorld Dashboard Syntax

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
  pull_request:
    branches: [main]
    paths:
      - "dashboard/**"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile dashboard backend
        run: python -m compileall -q dashboard/backend
      - name: Check dashboard JavaScript
        run: |
          node --check dashboard/app.js
          node --check dashboard/ticketbot.js
